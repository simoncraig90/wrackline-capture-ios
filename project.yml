name: WracklineCapture
options:
  bundleIdPrefix: com.wrackline
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Fill in your Personal Team ID (Xcode > Settings > Accounts > Manage Certificates, or the 10-character id under
    # "Team" in the Signing tab), or pass DEVELOPMENT_TEAM=XXXXXXXXXX on the xcodebuild command line.
    DEVELOPMENT_TEAM: ""
targets:
  Capture:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Wrackline Capture
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Records motion-capture video for the Wrackline rig.
        NSMicrophoneUsageDescription: The audio track is used only to line up the cameras (sync marks); the app never plays sound.
        NSLocalNetworkUsageDescription: The capture director on your Mac starts and stops recordings and downloads the clips over Wi-Fi.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wrackline.capture
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
